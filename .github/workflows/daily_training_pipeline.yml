name: AQIonic Daily Training & Model Registry Pipeline

on:
  schedule:
    # Runs daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  model_training:
    name: Daily Model Retraining & Model Registry Upload
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn shap joblib hopsworks pytest

      - name: Run Automated Verification Tests
        run: |
          python -m pytest tests/test_pipelines.py

      - name: Execute Model Retraining & Evaluation Pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
        run: |
          python pipelines/training_pipeline.py
